name: Validate standalone core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test the offline core
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check syntax and offline demo
        run: |
          python -m compileall -q src
          PYTHONPATH=src python -m shake_bake demo > /tmp/shake-bake-demo.json
  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build wheel
        run: |
          python -m pip install build 'setuptools>=77'
          python -m build --wheel --no-isolation
          python scripts/verify_wheel.py
      - name: Install optional SDK and wheel in a clean environment
        run: |
          python -m venv /tmp/shake-bake-installed
          /tmp/shake-bake-installed/bin/python -m pip install --require-hashes -r requirements/mcp.lock
          /tmp/shake-bake-installed/bin/python -m pip install --no-deps dist/*.whl
      - name: Verify installed CLI and real MCP stdio
        run: |
          cd /tmp
          /tmp/shake-bake-installed/bin/shake-bake doctor
          /tmp/shake-bake-installed/bin/shake-bake demo
          /tmp/shake-bake-installed/bin/python "$GITHUB_WORKSPACE/integration/mcp_stdio_smoke.py" --python /tmp/shake-bake-installed/bin/python
