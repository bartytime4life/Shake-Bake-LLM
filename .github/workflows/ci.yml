name: Validate recovered standalone source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test the standard-library core
        run: PYTHONPATH=src python -B -m unittest discover -s tests -v
      - name: Verify synthetic evidence coverage
        run: |
          PYTHONPATH=src python -B benchmarks/evaluate_selection.py
          PYTHONPATH=src python -B benchmarks/run_task_lab.py --evidence-only
      - name: Check interface JavaScript syntax
        run: |
          node --check src/shake_bake/web/app.js
          node scripts/frontend_smoke.cjs
          node scripts/model_readiness_test.cjs
          node scripts/clipboard_test.cjs
          node scripts/browser_server_test.cjs

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and inspect wheel
        run: |
          python -m pip install 'setuptools==84.2.1' 'wheel==0.48.0'
          python -m pip wheel --no-deps --no-build-isolation --no-index . --wheel-dir dist
          python scripts/verify_wheel.py
      - name: Install without runtime dependencies
        run: |
          python -m venv /tmp/shake-bake-installed
          /tmp/shake-bake-installed/bin/python -m pip install --no-deps --no-index dist/*.whl
      - name: Verify installed shared bridge and packaged demo
        run: |
          cd /tmp
          env -u PYTHONPATH /tmp/shake-bake-installed/bin/shake-bake doctor
          env -u PYTHONPATH /tmp/shake-bake-installed/bin/python "$GITHUB_WORKSPACE/scripts/installed_smoke.py"
      - name: Verify installed program and readiness regressions
        run: |
          cd /tmp
          env -u PYTHONPATH /tmp/shake-bake-installed/bin/python -B -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          node "$GITHUB_WORKSPACE/scripts/model_readiness_test.cjs" /tmp/shake-bake-installed/lib/python3.12/site-packages/shake_bake/web/app.js
          node "$GITHUB_WORKSPACE/scripts/clipboard_test.cjs" /tmp/shake-bake-installed/lib/python3.12/site-packages/shake_bake/web/app.js
      - name: Verify optional official SDK over stdio and shared service
        run: |
          /tmp/shake-bake-installed/bin/python -m pip install --require-hashes -r requirements/mcp.lock
          cd /tmp
          env -u PYTHONPATH /tmp/shake-bake-installed/bin/python "$GITHUB_WORKSPACE/integration/mcp_subprocess_smoke.py"
          env -u PYTHONPATH /tmp/shake-bake-installed/bin/python "$GITHUB_WORKSPACE/integration/mcp_shared_smoke.py"
          env -u PYTHONPATH /tmp/shake-bake-installed/bin/python "$GITHUB_WORKSPACE/integration/mcp_smoke.py"

  readiness-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/sb-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/sb-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify source browser readiness races
        env:
          NODE_PATH: ${{ runner.temp }}/sb-browser/node_modules
        run: node scripts/browser_readiness_test.cjs
      - name: Verify source clipboard and manual recovery
        env:
          NODE_PATH: ${{ runner.temp }}/sb-browser/node_modules
        run: node scripts/browser_clipboard_test.cjs
      - name: Verify source workbench state and keyboard recovery
        env:
          NODE_PATH: ${{ runner.temp }}/sb-browser/node_modules
        run: node scripts/browser_workbench_test.cjs
      - name: Build and install exact candidate
        run: |
          python -m pip install 'setuptools==84.2.1' 'wheel==0.48.0'
          python -m pip wheel --no-deps --no-build-isolation --no-index . --wheel-dir dist
          python scripts/verify_wheel.py
          python -m venv /tmp/sb-browser-installed
          /tmp/sb-browser-installed/bin/python -m pip install --no-deps --no-index dist/*.whl
      - name: Verify installed browser readiness races
        env:
          NODE_PATH: ${{ runner.temp }}/sb-browser/node_modules
        run: node scripts/browser_readiness_test.cjs /tmp/sb-browser-installed/bin/python
      - name: Verify installed clipboard and manual recovery
        env:
          NODE_PATH: ${{ runner.temp }}/sb-browser/node_modules
        run: node scripts/browser_clipboard_test.cjs /tmp/sb-browser-installed/bin/python
      - name: Verify installed workbench state and keyboard recovery
        env:
          NODE_PATH: ${{ runner.temp }}/sb-browser/node_modules
        run: node scripts/browser_workbench_test.cjs /tmp/sb-browser-installed/bin/python
