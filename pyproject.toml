[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shake-and-bake-assistant"
version = "0.4.0.dev29"
description = "Standalone local evidence preparation for cloud-assisted work"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "MODEL_LICENSES.json"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.scripts]
shake-bake = "shake_bake.cli:main"
shake-bake-mcp = "shake_bake.mcp_server:main"
shake-bake-ui = "shake_bake.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shake_bake = ["web/*.html", "web/*.css", "web/*.js", "web/*.json", "web/icons/*.svg", "web/icons/LICENSE", "demo/*.py", "demo/*.md", "default-policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
